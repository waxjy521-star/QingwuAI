<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>青雾 AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">🌫️</div>

      <div>
        <h1>青雾 AI</h1>
        <p>你的智能 AI 助手</p>
      </div>
    </header>

    <main id="messages">
      <div class="welcome">
        <h2>你好，我是青雾 AI</h2>
        <p>有什么想聊的吗？</p>
      </div>
    </main>

    <div class="input-area">

      <textarea
        id="input"
        placeholder="输入你的问题……"
        rows="1"
      ></textarea>

      <button id="send">
        发送
      </button>

    </div>

  </div>

  <script src="/app.js"></script>

</body>
</html>
